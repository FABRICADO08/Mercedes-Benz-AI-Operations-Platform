<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Mercedes-Benz AI Operations Platform</title>
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
</head>
<body>
  <div class="background-grid"></div>
  <main class="login-page">
    <section class="login-card">
      <div class="logo">
        <h1>Mercedes-Benz</h1>
        <p>AI Operations Platform</p>
      </div>

      <div class="welcome">
        <h2>Mission Control</h2>
        <span>Enterprise Authentication</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="employee@mercedes-benz.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required />
        </div>

        <button type="submit" class="login-btn">SIGN IN</button>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="face-section">
        <h3>Facial Recognition</h3>
        <div class="camera-frame">
          <div class="scanner"></div>
          <video id="camera" autoplay playsinline></video>
        </div>
        <button id="faceLogin" class="face-btn" type="button">Start Facial Recognition</button>
      </div>

      <div class="status" id="status">System Ready</div>
    </section>
  </main>

  <script src="assets/js/auth.js"></script>
</body>
</html>
